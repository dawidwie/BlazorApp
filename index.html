<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced HTML & CSS Example</title>
    <style>
        /* Base Page Styles */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px;
            background-color: #f4f7f6;
            color: #333;
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-top: 30px;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #fff;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }

        /* Form Styles */
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #2ecc71;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1>HTML Component Showcase</h1>

    <!-- 1. DATA TABLE -->
    <h2>Fruit Inventory & Pricing</h2>
    <table>
        <thead>
            <tr>
                <th>Fruit</th>
                <th>Stock Level</th>
                <th>Price per Kg</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Apples</td>
                <td>In Stock (50kg)</td>
                <td>$3.00</td>
            </tr>
            <tr>
                <td>Bananas</td>
                <td>Low Stock (12kg)</td>
                <td>$1.50</td>
            </tr>
            <tr>
                <td>Oranges</td>
                <td>Out of Stock</td>
                <td>$2.80</td>
            </tr>
        </tbody>
    </table>

    <!-- 2. USER INPUT FORM -->
    <h2>Join Our Newsletter</h2>
    <form action="#" method="POST">
        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="john@example.com" required>
        </div>
        
        <button type="submit">Subscribe Now</button>
    </form>

</body>
</html>
